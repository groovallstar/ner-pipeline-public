[project]
name = "ner-pipeline"
version = "0.1.0"
description = "Named Entity Recognition pipeline built on LangChain with multi-backend LLM support"
requires-python = ">=3.11"
dependencies = [
    # Data / ML
    "scikit-learn",
    "numpy",
    "pandas",
    "seaborn",
    "matplotlib",
    "emoji",
    "tiktoken",
    # NLP / HuggingFace
    "transformers",
    "datasets",
    "accelerate",
    "evaluate",
    "sentence-transformers",
    "bert-score",
    "seqeval",
    "sentencepiece",
    # LangChain ecosystem
    "langchain",
    "langgraph",
    "langchain-openai",
    "langchain-ollama",
    "langchain-huggingface",
    "langchain-community",
    "langchain-milvus",
    # Vector store
    "pymilvus",
    # Utilities
    "langdetect",
    "tavily-python",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
