services:
  ner-pipeline:
    image: ner-pipeline:dev
    container_name: ner_pipeline_dev
    build:
      context: ../../
      dockerfile: ./docker/dev/dockerfile
      args:
        USERNAME: ${USER:-devuser}
        USER_UID: ${DOCKER_UID:-1000}
        USER_GID: ${DOCKER_GID:-1000}
    env_file:
      - ./config/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/dev/.claude:/home/${USER:-devuser}/.claude
    privileged: true
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    command:
      - /bin/bash
      - -c
      - |
        sleep infinity
