# ja·ko·vi·en NER REST API 추론 서버 — 단일 GPU, 호스트 /data 모델 마운트.
# 라이프사이클은 start.sh/stop.sh/logs.sh, 설정 표면은 .env.example 참조.
# compose 는 같은 디렉토리의 .env 를 자동 로드한다.
services:
  ner-server:
    image: ${NER_SERVER_IMAGE:-ner-server:0.1.0}
    container_name: ${NER_SERVER_CONTAINER:-ner-server}
    build:
      context: ../../
      dockerfile: ./docker/server/Dockerfile
    environment:
      - NER_SERVER_MODEL_ROOT=${NER_SERVER_MODEL_ROOT:-/data/ner}
      - NER_SERVER_MAX_LENGTH=${NER_SERVER_MAX_LENGTH:-256}
      - NER_SERVER_MAX_CHARS=${NER_SERVER_MAX_CHARS:-20000}
      - NER_SERVER_MAX_BATCH=${NER_SERVER_MAX_BATCH:-64}
      - NER_SERVER_MAX_TOTAL_CHARS=${NER_SERVER_MAX_TOTAL_CHARS:-100000}
      - NER_SERVER_MAX_BODY_BYTES=${NER_SERVER_MAX_BODY_BYTES:-2097152}
      - NER_SERVER_MAX_CONCURRENCY=${NER_SERVER_MAX_CONCURRENCY:-8}
      - NER_SERVER_MAX_QUEUE=${NER_SERVER_MAX_QUEUE:-32}
      - NER_SERVER_ACQUIRE_TIMEOUT_S=${NER_SERVER_ACQUIRE_TIMEOUT_S:-10}
      - NER_SERVER_API_KEY=${NER_SERVER_API_KEY:-}
      - NER_SERVER_LOG_LEVEL=${NER_SERVER_LOG_LEVEL:-INFO}
      - NER_SERVER_LOG_FILE=${NER_SERVER_LOG_FILE:-/tmp/ner-server.log}
      - NER_SERVER_HOST=0.0.0.0
      - NER_SERVER_PORT=${NER_SERVER_PORT:-8008}
      # 번역 키에는 compose 기본값을 주지 않는다 — 여기서 값을 채우면 서버가
      # "안 준 것"과 구별하지 못해, 고른 백엔드에 안 맞는 키가 조용히 실린다.
      - NER_SERVER_TRANSLATE_ENABLED=${NER_SERVER_TRANSLATE_ENABLED:-false}
      - NER_SERVER_TRANSLATE_BACKEND=${NER_SERVER_TRANSLATE_BACKEND:-}
      - NER_SERVER_TRANSLATE_MODEL=${NER_SERVER_TRANSLATE_MODEL:-}
      - NER_SERVER_TRANSLATE_MAX_CONCURRENCY=${NER_SERVER_TRANSLATE_MAX_CONCURRENCY:-2}
      - NER_SERVER_TRANSLATE_BASE_URL=${NER_SERVER_TRANSLATE_BASE_URL:-}
      - NER_SERVER_TRANSLATE_API_KEY=${NER_SERVER_TRANSLATE_API_KEY:-}
      - NER_SERVER_TRANSLATE_TIMEOUT_S=${NER_SERVER_TRANSLATE_TIMEOUT_S:-}
      - NER_SERVER_TRANSLATE_DEVICE=${NER_SERVER_TRANSLATE_DEVICE:-}
      - NER_SERVER_TRANSLATE_NO_REPEAT_NGRAM=${NER_SERVER_TRANSLATE_NO_REPEAT_NGRAM:-}
      - HF_HOME=${HF_HOME:-/data/ner/_hf_cache}
    volumes:
      - ${NER_SERVER_DATA_DIR:-/data}:/data
      # HF 캐시를 호스트에 고정한다 — backend=nllb 는 기동 때 허브에서 가중치를
      # 내려받으므로(1.3B 기준 수 GB), 캐시가 컨테이너 안에만 있으면 다시 만들
      # 때마다 다시 받는다. 기본 경로는 /data 안이라 위 마운트와 겹치는데,
      # 캐시를 다른 디스크로 옮길 때 이 줄만 바꾸면 된다.
      - ${NER_SERVER_HF_CACHE:-/data/ner/_hf_cache}:${HF_HOME:-/data/ner/_hf_cache}
    ports:
      - '${NER_SERVER_PORT:-8008}:${NER_SERVER_PORT:-8008}'
    # 컨테이너에서 호스트(published) 서비스에 닿기 위한 매핑 — 번역 백엔드
    # (vLLM)가 호스트 :8081 에 있을 때 NER_SERVER_TRANSLATE_BASE_URL 을
    # host.docker.internal 로 가리킬 수 있게 한다(Linux Engine 은 이 매핑이
    # 없으면 host.docker.internal 이 해석되지 않는다).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    deploy:
      resources:
        reservations:
          devices:
            # GPU 1장만 컨테이너에 노출(서비스 GPU 고정). 기본 0, 다른 GPU 는
            # NER_SERVER_GPU 로 교체. device_ids 라 컨테이너 안에선 cuda:0.
            - driver: nvidia
              device_ids: ['${NER_SERVER_GPU:-0}']
              capabilities: [gpu]
    # 준비성: 전 언어 로드 완료(status:"ok")만 healthy. start_period 동안은
    # starting 으로 트래픽을 받지 않는다(모델 로드 중 차단). 미로드→degraded.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:${NER_SERVER_PORT:-8008}/health
          | grep -qE '"status": ?"ok"' || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
