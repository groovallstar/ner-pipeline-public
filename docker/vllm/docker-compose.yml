services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.23.0}
    container_name: ${VLLM_CONTAINER:-vllm-server}
    env_file:
      - ./config/.env
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
    volumes:
      - /data:/data
      - /work/.huggingface:/root/.cache/huggingface
    ports:
      - '${VLLM_PORT:-8000}:${VLLM_PORT:-8000}'
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    command: >
      --model ${VLLM_MODEL}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.9}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL:-1}
      --dtype ${VLLM_DTYPE:-auto}
      --host 0.0.0.0
      --port ${VLLM_PORT:-8000}
      --generation-config vllm
      ${VLLM_EXTRA_ARGS:-}
      --default-chat-template-kwargs '{"enable_thinking": false}'
