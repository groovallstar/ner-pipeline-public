name: 작업 이슈
description: 기능·수정·진단 작업 단위를 등록한다
body:
  - type: markdown
    attributes:
      value: |
        작성 기준은 docs/issues/AGENTS.md의 GitHub 이슈 절차와 양식이다.
        작업 문서와 동일한 제목을 사용한다. 진행 과정·결정·검증 결과는 작업 문서에서 관리한다.
        생성 시 작업 요약만 작성하고, 나머지는 내용이 생길 때 추가한다.
  - type: textarea
    id: summary
    attributes:
      label: 작업 요약
      description: 이 작업이 필요한 이유와 달성하려는 결과를 간단히 작성한다.
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: 작업 문서
      description: 문서를 커밋·푸시하여 원격에서 접근할 수 있게 되면 링크를 추가한다. 게시 전에는 문서 경로와 게시 대기 상태를 표시한다.
    validations:
      required: false
  - type: textarea
    id: changes
    attributes:
      label: 관련 변경
      description: 관련 PR과 주요 커밋을 연결한다.
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: 종료 요약
      description: 종료 시 결과와 남은 작업을 기록한다. 완료·취소·다른 작업으로 대체한 경우를 구분한다.
    validations:
      required: false
