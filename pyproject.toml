[project]
name = "ner-pipeline"
version = "0.1.0"
description = "Named Entity Recognition pipeline built on LangChain with multi-backend LLM support"
requires-python = ">=3.13"
dependencies = [
    # PyTorch (CUDA 13.0)
    "torch",
    # Data / ML
    "scikit-learn",
    "numpy",
    "pandas",
    "seaborn",
    "matplotlib",
    "emoji",
    "tiktoken",
    # NLP / HuggingFace
    "transformers",
    "datasets",
    "accelerate",
    "evaluate",
    "sentence-transformers",
    "bert-score",
    "seqeval",
    "sentencepiece",
    # LangChain ecosystem
    "langchain",
    "langgraph",
    "langchain-openai",
    "langchain-huggingface",
    "langchain-community",
    "langchain-milvus",
    # Vector store
    "pymilvus",
    # Web crawling
    "beautifulsoup4>=4.12,<5",
    "requests",
    "lxml>=5.2,<6",
    "feedparser>=6.0,<7",
    # Korean sentence splitter
    "kiwipiepy>=0.18,<1",
    # Utilities
    "langdetect",
    "tavily-python",
    # NLP tokenization
    "spacy",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "pytorch-crf>=0.7.2",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/ner",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring HF dataset cache",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]
