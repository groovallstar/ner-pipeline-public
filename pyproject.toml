[project]
name = "ner-pipeline"
version = "0.1.0"
description = "Multilingual NER pipeline (ja/ko/vi/en): vLLM labeling, BERT token classification, synthetic PII augmentation, FastAPI serving"
requires-python = ">=3.13"
dependencies = [
    # PyTorch (CUDA 13.0)
    "torch",
    # Data / ML
    "numpy",
    # NLP / HuggingFace
    "transformers",
    "datasets",
    # transformers 의 Trainer 가 요구한다 — import 문에는 안 보인다
    "accelerate",
    # BIO 레벨 메트릭(`ner.metrics.bio_metrics`)
    "seqeval",
    # sentencepiece 토크나이저(xlm-roberta·deberta-v3)를 다루는 데 둘 다 필요하다.
    # protobuf 는 spm 모델을 fast 토크나이저로 변환할 때 transformers 가 찾는다 —
    # 없으면 변환이 tiktoken 폴백까지 내려갔다가 ImportError 로 끝난다.
    "sentencepiece",
    "protobuf",
    # OpenAI SDK (vLLM/OpenAI 호환 클라이언트 — labelers·server 직접 사용)
    "openai",
    "requests",
    "tqdm",
    # Web API server (ja/ko/vi/en NER REST API)
    "fastapi",
    "uvicorn",
    # 언어별 토크나이저 백엔드 — ja 는 BertJapaneseTokenizer, vi 는 PhoBERT
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "pyvi>=0.1.1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/ner",
    "src/server",
]

# explicit = true 필수.
# 이 미러는 requests/urllib3/certifi/charset-normalizer 등의 낡은 복사본도
# 함께 제공하기 때문에, 생략하면 uv 가 그쪽을 먼저 집어가 일반 패키지까지
# 수년 전 버전으로 내려앉습니다. explicit 를 켜면 아래 sources 에서
# 명시한 torch 에만 이 인덱스를 사용합니다.
# (torch 의 nvidia-*/triton 의존성은 PyPI 에서 정상 해결됩니다.)
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

# select 를 명시하지 않으면 ruff 의 그때그때 기본값을 그대로 물려받아,
# 린터를 올리는 것만으로 커밋 게이트(refuter_gate 의 결정적 층)가 막힌다.
# 실제로 0.15 → 0.16 에서 기본 활성 규칙이 59 개에서 413 개로 늘며 지적이
# 1 건에서 920 건이 됐다. 아래 값은 0.15 까지의 기본값과 같다.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# 저장소 루트를 sys.path 에 올린다. tests/ 에는 __init__.py 도 루트 conftest.py 도
# 없어서, 이것이 없으면 테스트 모듈이 최상위 이름으로 import 되고 그 파일이 있던
# 디렉토리만 sys.path 에 들어간다. 그러면 형제 테스트 모듈을 `tests.ner...` 로 읽는
# 파일이 수집 단계에서 ImportError 를 내고 전체 수집이 중단된다. `python -m pytest`
# 는 cwd 를 넣어주므로 통과하고 `pytest`·`uv run pytest` 는 실패해, 호출 형태에 따라
# 결과가 갈렸다 — 통과 여부가 무엇을 쳤는지에 달리면 통과가 증거가 되지 못한다.
pythonpath = ["."]
markers = [
    "integration: tests requiring HF dataset cache",
    "live: tests that boot a real uvicorn server (need /data models)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    # tests/server 가 직접 import 한다(TestClient 경유가 아닌 실 HTTP 호출)
    "httpx",
]
